<svg viewBox="0 0 800 260" xmlns="http://www.w3.org/2000/svg">
  <defs><style>text{font-family:'Courier New',Courier,monospace}</style></defs>
  <rect width="800" height="260" fill="#0d1117" rx="10"/>
  <rect width="800" height="40" fill="#161b22" rx="10"/>
  <rect y="20" width="800" height="20" fill="#161b22"/>
  <circle cx="24" cy="20" r="6" fill="#f85149"/>
  <circle cx="44" cy="20" r="6" fill="#d29922"/>
  <circle cx="64" cy="20" r="6" fill="#3fb950"/>
  <text x="400" y="25" text-anchor="middle" fill="#8b949e" font-size="12">xargs — Build and Execute Commands from Standard Input</text>

  <!-- Pipeline flow title -->
  <text x="20" y="62" fill="#58a6ff" font-size="11" font-weight="bold">● PIPELINE FLOW</text>

  <!-- find box -->
  <rect x="20" y="68" width="100" height="50" fill="#161b22" rx="5" stroke="#58a6ff" stroke-width="2"/>
  <text x="70" y="88" text-anchor="middle" fill="#58a6ff" font-size="10">find</text>
  <text x="70" y="101" text-anchor="middle" fill="#8b949e" font-size="8">file1.log</text>
  <text x="70" y="112" text-anchor="middle" fill="#8b949e" font-size="8">file2.log</text>

  <!-- pipe -->
  <rect x="122" y="88" width="20" height="16" fill="#30363d" rx="2"/>
  <text x="132" y="99" text-anchor="middle" fill="#e6edf3" font-size="10">|</text>

  <!-- xargs box -->
  <rect x="144" y="68" width="110" height="50" fill="#161b22" rx="5" stroke="#d29922" stroke-width="2"/>
  <text x="199" y="86" text-anchor="middle" fill="#d29922" font-size="11">xargs</text>
  <text x="199" y="99" text-anchor="middle" fill="#8b949e" font-size="8">reads stdin</text>
  <text x="199" y="111" text-anchor="middle" fill="#8b949e" font-size="8">builds args</text>

  <!-- Arrow -->
  <line x1="254" y1="93" x2="282" y2="93" stroke="#d29922" stroke-width="1.5"/>
  <polygon points="282,89 290,93 282,97" fill="#d29922"/>

  <!-- command box -->
  <rect x="290" y="68" width="120" height="50" fill="#0d3320" rx="5" stroke="#3fb950" stroke-width="2"/>
  <text x="350" y="86" text-anchor="middle" fill="#3fb950" font-size="10">gzip</text>
  <text x="350" y="99" text-anchor="middle" fill="#3fb950" font-size="8">file1.log</text>
  <text x="350" y="111" text-anchor="middle" fill="#3fb950" font-size="8">file2.log</text>

  <!-- Parallel execution visualization -->
  <text x="440" y="62" fill="#bc8cff" font-size="11" font-weight="bold">● -P PARALLEL EXECUTION</text>
  <rect x="440" y="68" width="340" height="50" fill="#161b22" rx="5" stroke="#bc8cff" stroke-width="1"/>
  <text x="450" y="84" fill="#8b949e" font-size="9">find /logs -name "*.log" | xargs -P 4 -I {} gzip {}</text>
  <!-- 4 parallel job bars -->
  <text x="450" y="100" fill="#bc8cff" font-size="8">job1 ████████████ gzip a.log</text>
  <text x="450" y="111" fill="#bc8cff" font-size="8">job2 ████████ gzip b.log</text>
  <text x="604" y="100" fill="#bc8cff" font-size="8">job3 ██████████ gzip c.log</text>
  <text x="604" y="111" fill="#bc8cff" font-size="8">job4 █████ gzip d.log</text>

  <!-- Key patterns -->
  <text x="20" y="138" fill="#3fb950" font-size="11" font-weight="bold">● KEY PATTERNS</text>
  <rect x="20" y="144" width="760" height="72" fill="#161b22" rx="4" stroke="#30363d" stroke-width="1"/>

  <text x="30" y="160" fill="#d29922" font-size="9">Basic:</text>
  <text x="78" y="160" fill="#3fb950" font-size="9">find /tmp -name "*.tmp" | xargs rm -f</text>
  <text x="400" y="160" fill="#8b949e" font-size="8">remove all temp files</text>

  <text x="30" y="175" fill="#d29922" font-size="9">-I {}:</text>
  <text x="78" y="175" fill="#3fb950" font-size="9">cat servers.txt | xargs -I {} ssh deploy@{} "uptime"</text>
  <text x="400" y="175" fill="#8b949e" font-size="8">run per-item with placeholder</text>

  <text x="30" y="190" fill="#d29922" font-size="9">-0:</text>
  <text x="78" y="190" fill="#3fb950" font-size="9">find /var/www -name "*.log" -print0 | xargs -0 rm</text>
  <text x="400" y="190" fill="#8b949e" font-size="8">null-safe (handles spaces in names)</text>

  <text x="30" y="205" fill="#d29922" font-size="9">-n N:</text>
  <text x="78" y="205" fill="#3fb950" font-size="9">echo "a b c d" | tr ' ' '\n' | xargs -n 2 echo</text>
  <text x="400" y="205" fill="#8b949e" font-size="8">N items per command invocation</text>

  <!-- Bottom bar -->
  <line x1="20" y1="225" x2="780" y2="225" stroke="#30363d" stroke-width="1"/>
  <text x="20" y="248" fill="#8b949e" font-size="10">Tip: always pair  find -print0  with  xargs -0  when filenames may contain spaces or special characters</text>
</svg>
