<svg viewBox="0 0 800 260" xmlns="http://www.w3.org/2000/svg">
  <defs><style>text{font-family:'Courier New',Courier,monospace}</style></defs>
  <rect width="800" height="260" fill="#0d1117" rx="10"/>
  <rect width="800" height="40" fill="#161b22" rx="10"/>
  <rect y="20" width="800" height="20" fill="#161b22"/>
  <circle cx="24" cy="20" r="6" fill="#f85149"/>
  <circle cx="44" cy="20" r="6" fill="#d29922"/>
  <circle cx="64" cy="20" r="6" fill="#3fb950"/>
  <text x="400" y="25" text-anchor="middle" fill="#8b949e" font-size="12">SSH &amp; Secure Remote Access — ssh · scp · rsync · ssh-keygen · config</text>

  <!-- Topology label -->
  <text x="20" y="62" fill="#58a6ff" font-size="11" font-weight="bold">● SSH CONNECTION TOPOLOGY</text>

  <!-- Local machine -->
  <rect x="20" y="70" width="120" height="52" fill="#161b22" rx="6" stroke="#58a6ff" stroke-width="2"/>
  <text x="80" y="88" text-anchor="middle" fill="#58a6ff" font-size="10">💻 Local</text>
  <text x="80" y="101" text-anchor="middle" fill="#8b949e" font-size="9">~/.ssh/id_ed25519</text>
  <text x="80" y="114" text-anchor="middle" fill="#8b949e" font-size="9">~/.ssh/config</text>

  <!-- Encrypted tunnel arrow -->
  <line x1="140" y1="96" x2="248" y2="96" stroke="#3fb950" stroke-width="2" stroke-dasharray="6,3"/>
  <polygon points="248,92 256,96 248,100" fill="#3fb950"/>
  <text x="198" y="88" text-anchor="middle" fill="#3fb950" font-size="8">🔒 TLS</text>
  <text x="198" y="110" text-anchor="middle" fill="#8b949e" font-size="8">port 22</text>

  <!-- Bastion host -->
  <rect x="256" y="70" width="130" height="52" fill="#161b22" rx="6" stroke="#d29922" stroke-width="2"/>
  <text x="321" y="88" text-anchor="middle" fill="#d29922" font-size="10">🏰 Bastion</text>
  <text x="321" y="101" text-anchor="middle" fill="#8b949e" font-size="9">jump.example.com</text>
  <text x="321" y="114" text-anchor="middle" fill="#8b949e" font-size="9">ProxyJump</text>

  <!-- Arrow to internal -->
  <line x1="386" y1="86" x2="456" y2="76" stroke="#30363d" stroke-width="1.5" stroke-dasharray="4"/>
  <polygon points="451,70 460,73 455,81" fill="#30363d"/>
  <line x1="386" y1="104" x2="456" y2="114" stroke="#30363d" stroke-width="1.5" stroke-dasharray="4"/>
  <polygon points="451,119 460,117 455,109" fill="#30363d"/>

  <!-- Internal Server A -->
  <rect x="460" y="60" width="130" height="34" fill="#161b22" rx="5" stroke="#3fb950" stroke-width="1"/>
  <text x="525" y="74" text-anchor="middle" fill="#3fb950" font-size="9">🖥 web-server-01</text>
  <text x="525" y="86" text-anchor="middle" fill="#8b949e" font-size="8">10.0.1.10 (private)</text>

  <!-- Internal Server B -->
  <rect x="460" y="104" width="130" height="34" fill="#161b22" rx="5" stroke="#3fb950" stroke-width="1"/>
  <text x="525" y="118" text-anchor="middle" fill="#3fb950" font-size="9">🖥 db-server-01</text>
  <text x="525" y="130" text-anchor="middle" fill="#8b949e" font-size="8">10.0.1.20 (private)</text>

  <!-- Port forwarding label -->
  <line x1="140" y1="122" x2="256" y2="122" stroke="#bc8cff" stroke-width="1" stroke-dasharray="3"/>
  <text x="198" y="136" text-anchor="middle" fill="#bc8cff" font-size="8">-L 8080:localhost:3000</text>

  <!-- ssh config box -->
  <rect x="610" y="58" width="175" height="82" fill="#161b22" rx="5" stroke="#30363d" stroke-width="1"/>
  <text x="620" y="72" fill="#8b949e" font-size="9">~/.ssh/config</text>
  <line x1="615" y1="76" x2="780" y2="76" stroke="#30363d" stroke-width="1"/>
  <text x="620" y="90" fill="#d29922" font-size="9">Host bastion</text>
  <text x="634" y="103" fill="#8b949e" font-size="8">HostName jump.example.com</text>
  <text x="634" y="115" fill="#8b949e" font-size="8">User ec2-user</text>
  <text x="620" y="128" fill="#d29922" font-size="9">Host prod-db</text>
  <text x="634" y="140" fill="#8b949e" font-size="8">ProxyJump bastion</text>

  <!-- Bottom bar -->
  <line x1="20" y1="158" x2="780" y2="158" stroke="#30363d" stroke-width="1"/>
  <text x="20" y="177" fill="#8b949e" font-size="10">$</text>
  <text x="32" y="177" fill="#3fb950" font-size="10">ssh-keygen -t ed25519</text>
  <text x="200" y="177" fill="#30363d" font-size="10">|</text>
  <text x="208" y="177" fill="#3fb950" font-size="10">ssh-copy-id user@host</text>
  <text x="366" y="177" fill="#30363d" font-size="10">|</text>
  <text x="374" y="177" fill="#3fb950" font-size="10">ssh -J bastion user@internal</text>
  <text x="562" y="177" fill="#30363d" font-size="10">|</text>
  <text x="570" y="177" fill="#3fb950" font-size="10">ssh -L 8080:localhost:3000 host</text>
  <text x="20" y="205" fill="#8b949e" font-size="10">$</text>
  <text x="32" y="205" fill="#3fb950" font-size="10">rsync -avz --delete /local/ user@host:/remote/</text>
  <text x="308" y="205" fill="#30363d" font-size="10">|</text>
  <text x="316" y="205" fill="#3fb950" font-size="10">scp -r /local/dir user@host:/remote/</text>
  <text x="524" y="205" fill="#30363d" font-size="10">|</text>
  <text x="532" y="205" fill="#3fb950" font-size="10">ssh user@host "systemctl restart app"</text>
  <text x="20" y="248" fill="#8b949e" font-size="10">Tip: use ~/.ssh/config to define hosts once and connect with just "ssh prod-db" — no flags needed</text>
</svg>
