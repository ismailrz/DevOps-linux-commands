<svg viewBox="0 0 800 260" xmlns="http://www.w3.org/2000/svg">
  <defs><style>text{font-family:'Courier New',Courier,monospace}</style></defs>
  <rect width="800" height="260" fill="#0d1117" rx="10"/>
  <rect width="800" height="40" fill="#161b22" rx="10"/>
  <rect y="20" width="800" height="20" fill="#161b22"/>
  <circle cx="24" cy="20" r="6" fill="#f85149"/>
  <circle cx="44" cy="20" r="6" fill="#d29922"/>
  <circle cx="64" cy="20" r="6" fill="#3fb950"/>
  <text x="400" y="25" text-anchor="middle" fill="#8b949e" font-size="12">kubectl — Kubernetes Cluster Management Commands</text>

  <!-- Architecture diagram -->
  <text x="20" y="62" fill="#58a6ff" font-size="11" font-weight="bold">● KUBECTL → CLUSTER ARCHITECTURE</text>

  <!-- kubectl CLI -->
  <rect x="20" y="70" width="90" height="80" fill="#161b22" rx="5" stroke="#58a6ff" stroke-width="2"/>
  <text x="65" y="88" text-anchor="middle" fill="#58a6ff" font-size="10">kubectl</text>
  <text x="65" y="101" text-anchor="middle" fill="#8b949e" font-size="8">get pods</text>
  <text x="65" y="112" text-anchor="middle" fill="#8b949e" font-size="8">apply -f</text>
  <text x="65" y="123" text-anchor="middle" fill="#8b949e" font-size="8">logs</text>
  <text x="65" y="134" text-anchor="middle" fill="#8b949e" font-size="8">exec</text>
  <text x="65" y="145" text-anchor="middle" fill="#8b949e" font-size="8">rollout</text>

  <!-- Arrow to API server -->
  <line x1="110" y1="110" x2="158" y2="110" stroke="#58a6ff" stroke-width="2"/>
  <polygon points="158,106 166,110 158,114" fill="#58a6ff"/>
  <text x="134" y="104" text-anchor="middle" fill="#58a6ff" font-size="7">HTTPS</text>

  <!-- Control Plane -->
  <rect x="166" y="58" width="130" height="104" fill="#161b22" rx="5" stroke="#d29922" stroke-width="2"/>
  <text x="231" y="74" text-anchor="middle" fill="#d29922" font-size="9">Control Plane</text>
  <line x1="171" y1="78" x2="291" y2="78" stroke="#30363d" stroke-width="1"/>
  <rect x="174" y="82" width="114" height="16" fill="#21262d" rx="2"/>
  <text x="231" y="93" text-anchor="middle" fill="#8b949e" font-size="8">API Server</text>
  <rect x="174" y="102" width="114" height="16" fill="#21262d" rx="2"/>
  <text x="231" y="113" text-anchor="middle" fill="#8b949e" font-size="8">etcd (state store)</text>
  <rect x="174" y="122" width="114" height="16" fill="#21262d" rx="2"/>
  <text x="231" y="133" text-anchor="middle" fill="#8b949e" font-size="8">Scheduler</text>
  <rect x="174" y="142" width="114" height="16" fill="#21262d" rx="2"/>
  <text x="231" y="153" text-anchor="middle" fill="#8b949e" font-size="8">Controller Mgr</text>

  <!-- Arrow to nodes -->
  <line x1="296" y1="110" x2="338" y2="110" stroke="#30363d" stroke-width="2"/>
  <polygon points="338,106 346,110 338,114" fill="#30363d"/>

  <!-- Worker Node 1 -->
  <rect x="346" y="58" width="130" height="104" fill="#161b22" rx="5" stroke="#3fb950" stroke-width="1"/>
  <text x="411" y="74" text-anchor="middle" fill="#3fb950" font-size="9">Worker Node 1</text>
  <line x1="351" y1="78" x2="471" y2="78" stroke="#30363d" stroke-width="1"/>
  <!-- Pods -->
  <rect x="354" y="83" width="52" height="20" fill="#0d3320" rx="2" stroke="#3fb950" stroke-width="1"/>
  <text x="380" y="96" text-anchor="middle" fill="#3fb950" font-size="7">pod: web-1</text>
  <rect x="412" y="83" width="52" height="20" fill="#0d3320" rx="2" stroke="#3fb950" stroke-width="1"/>
  <text x="438" y="96" text-anchor="middle" fill="#3fb950" font-size="7">pod: web-2</text>
  <rect x="354" y="108" width="52" height="20" fill="#0d3320" rx="2" stroke="#3fb950" stroke-width="1"/>
  <text x="380" y="121" text-anchor="middle" fill="#3fb950" font-size="7">pod: api-1</text>
  <rect x="412" y="108" width="52" height="20" fill="#161b22" rx="2" stroke="#30363d" stroke-width="1"/>
  <text x="438" y="121" text-anchor="middle" fill="#8b949e" font-size="7">kubelet</text>
  <!-- Service -->
  <rect x="354" y="133" width="110" height="20" fill="#1c3a5e" rx="2" stroke="#58a6ff" stroke-width="1"/>
  <text x="409" y="146" text-anchor="middle" fill="#58a6ff" font-size="7">Service: web (port 80)</text>

  <!-- Worker Node 2 -->
  <rect x="490" y="58" width="130" height="104" fill="#161b22" rx="5" stroke="#3fb950" stroke-width="1"/>
  <text x="555" y="74" text-anchor="middle" fill="#3fb950" font-size="9">Worker Node 2</text>
  <line x1="495" y1="78" x2="615" y2="78" stroke="#30363d" stroke-width="1"/>
  <rect x="498" y="83" width="52" height="20" fill="#0d3320" rx="2" stroke="#3fb950" stroke-width="1"/>
  <text x="524" y="96" text-anchor="middle" fill="#3fb950" font-size="7">pod: web-3</text>
  <rect x="556" y="83" width="52" height="20" fill="#0d3320" rx="2" stroke="#3fb950" stroke-width="1"/>
  <text x="582" y="96" text-anchor="middle" fill="#3fb950" font-size="7">pod: db-1</text>
  <rect x="498" y="108" width="110" height="20" fill="#161b22" rx="2" stroke="#30363d" stroke-width="1"/>
  <text x="553" y="121" text-anchor="middle" fill="#8b949e" font-size="7">kubelet + kube-proxy</text>
  <rect x="498" y="133" width="110" height="20" fill="#1c3a5e" rx="2" stroke="#58a6ff" stroke-width="1"/>
  <text x="553" y="146" text-anchor="middle" fill="#58a6ff" font-size="7">Service: db (port 5432)</text>

  <!-- Quick commands box -->
  <rect x="640" y="58" width="148" height="104" fill="#161b22" rx="5" stroke="#30363d" stroke-width="1"/>
  <text x="714" y="73" text-anchor="middle" fill="#d29922" font-size="9">Quick Ref</text>
  <line x1="645" y1="77" x2="783" y2="77" stroke="#30363d" stroke-width="1"/>
  <text x="650" y="91"  fill="#3fb950" font-size="8">get pods -A</text>
  <text x="650" y="103" fill="#3fb950" font-size="8">describe pod X</text>
  <text x="650" y="115" fill="#3fb950" font-size="8">logs -f pod X</text>
  <text x="650" y="127" fill="#3fb950" font-size="8">exec -it pod -- sh</text>
  <text x="650" y="139" fill="#3fb950" font-size="8">rollout undo dep/X</text>
  <text x="650" y="151" fill="#3fb950" font-size="8">scale dep X --r=5</text>

  <!-- Bottom commands -->
  <line x1="20" y1="174" x2="780" y2="174" stroke="#30363d" stroke-width="1"/>
  <text x="20" y="193" fill="#8b949e" font-size="10">$</text>
  <text x="32" y="193" fill="#3fb950" font-size="10">kubectl get pods</text>
  <text x="180" y="193" fill="#30363d" font-size="10">|</text>
  <text x="188" y="193" fill="#3fb950" font-size="10">kubectl apply -f deploy.yaml</text>
  <text x="390" y="193" fill="#30363d" font-size="10">|</text>
  <text x="398" y="193" fill="#3fb950" font-size="10">kubectl logs -f my-pod</text>
  <text x="560" y="193" fill="#30363d" font-size="10">|</text>
  <text x="568" y="193" fill="#3fb950" font-size="10">kubectl rollout undo deployment/app</text>
  <text x="20" y="218" fill="#8b949e" font-size="10">$</text>
  <text x="32" y="218" fill="#3fb950" font-size="10">kubectl exec -it my-pod -- bash</text>
  <text x="260" y="218" fill="#30363d" font-size="10">|</text>
  <text x="268" y="218" fill="#3fb950" font-size="10">kubectl port-forward pod/X 8080:8080</text>
  <text x="502" y="218" fill="#30363d" font-size="10">|</text>
  <text x="510" y="218" fill="#3fb950" font-size="10">kubectl config use-context prod</text>
  <text x="20" y="248" fill="#8b949e" font-size="10">Tip: kubectl get pods -w  watches for status changes live — useful during deployments and rollouts</text>
</svg>
