<svg viewBox="0 0 800 260" xmlns="http://www.w3.org/2000/svg">
  <defs><style>text{font-family:'Courier New',Courier,monospace}</style></defs>
  <rect width="800" height="260" fill="#0d1117" rx="10"/>
  <rect width="800" height="40" fill="#161b22" rx="10"/>
  <rect y="20" width="800" height="20" fill="#161b22"/>
  <circle cx="24" cy="20" r="6" fill="#f85149"/>
  <circle cx="44" cy="20" r="6" fill="#d29922"/>
  <circle cx="64" cy="20" r="6" fill="#3fb950"/>
  <text x="400" y="25" text-anchor="middle" fill="#8b949e" font-size="12">File Operations &amp; Text Processing — find · grep · sed · awk · tar</text>

  <!-- Pipeline title -->
  <text x="20" y="62" fill="#58a6ff" font-size="11" font-weight="bold">● UNIX TEXT PROCESSING PIPELINE</text>

  <!-- find box -->
  <rect x="20" y="70" width="80" height="44" fill="#161b22" rx="5" stroke="#58a6ff" stroke-width="2"/>
  <text x="60" y="88" text-anchor="middle" fill="#58a6ff" font-size="11">find</text>
  <text x="60" y="101" text-anchor="middle" fill="#8b949e" font-size="8">locate files</text>
  <text x="60" y="111" text-anchor="middle" fill="#8b949e" font-size="8">by name/size/time</text>

  <!-- pipe -->
  <rect x="102" y="88" width="24" height="16" fill="#30363d" rx="2"/>
  <text x="114" y="99" text-anchor="middle" fill="#e6edf3" font-size="9">|</text>

  <!-- grep box -->
  <rect x="128" y="70" width="80" height="44" fill="#161b22" rx="5" stroke="#3fb950" stroke-width="2"/>
  <text x="168" y="88" text-anchor="middle" fill="#3fb950" font-size="11">grep</text>
  <text x="168" y="101" text-anchor="middle" fill="#8b949e" font-size="8">filter lines</text>
  <text x="168" y="111" text-anchor="middle" fill="#8b949e" font-size="8">by pattern</text>

  <!-- pipe -->
  <rect x="210" y="88" width="24" height="16" fill="#30363d" rx="2"/>
  <text x="222" y="99" text-anchor="middle" fill="#e6edf3" font-size="9">|</text>

  <!-- sed box -->
  <rect x="236" y="70" width="80" height="44" fill="#161b22" rx="5" stroke="#d29922" stroke-width="2"/>
  <text x="276" y="88" text-anchor="middle" fill="#d29922" font-size="11">sed</text>
  <text x="276" y="101" text-anchor="middle" fill="#8b949e" font-size="8">transform</text>
  <text x="276" y="111" text-anchor="middle" fill="#8b949e" font-size="8">substitute/delete</text>

  <!-- pipe -->
  <rect x="318" y="88" width="24" height="16" fill="#30363d" rx="2"/>
  <text x="330" y="99" text-anchor="middle" fill="#e6edf3" font-size="9">|</text>

  <!-- awk box -->
  <rect x="344" y="70" width="80" height="44" fill="#161b22" rx="5" stroke="#bc8cff" stroke-width="2"/>
  <text x="384" y="88" text-anchor="middle" fill="#bc8cff" font-size="11">awk</text>
  <text x="384" y="101" text-anchor="middle" fill="#8b949e" font-size="8">extract fields</text>
  <text x="384" y="111" text-anchor="middle" fill="#8b949e" font-size="8">aggregate/count</text>

  <!-- arrow to output -->
  <line x1="424" y1="92" x2="452" y2="92" stroke="#30363d" stroke-width="1.5"/>
  <polygon points="452,88 460,92 452,96" fill="#30363d"/>

  <!-- output box -->
  <rect x="460" y="70" width="80" height="44" fill="#0d3320" rx="5" stroke="#3fb950" stroke-width="1"/>
  <text x="500" y="90" text-anchor="middle" fill="#3fb950" font-size="10">Output</text>
  <text x="500" y="103" text-anchor="middle" fill="#8b949e" font-size="8">stdout / file</text>

  <!-- tar section -->
  <rect x="560" y="68" width="220" height="52" fill="#161b22" rx="5" stroke="#d29922" stroke-width="1"/>
  <text x="570" y="84" fill="#d29922" font-size="10">tar — Archive &amp; Compress</text>
  <text x="570" y="99" fill="#3fb950" font-size="9">tar -czvf out.tar.gz /path</text>
  <text x="570" y="111" fill="#8b949e" font-size="8">-c create  -z gzip  -v verbose  -f file</text>
  <text x="570" y="122" fill="#3fb950" font-size="9">tar -xzvf out.tar.gz -C /dest</text>

  <!-- Examples section -->
  <text x="20" y="136" fill="#3fb950" font-size="10" font-weight="bold">● REAL-WORLD EXAMPLES</text>
  <rect x="20" y="142" width="490" height="52" fill="#161b22" rx="4" stroke="#30363d" stroke-width="1"/>
  <text x="30" y="157" fill="#8b949e" font-size="9">find /var/log -name "*.log" -mtime +7 -delete</text>
  <text x="330" y="157" fill="#58a6ff" font-size="9">← delete logs older than 7 days</text>
  <text x="30" y="170" fill="#8b949e" font-size="9">grep -r "ERROR" /var/log/app/ | awk '{print $1}' | sort | uniq -c</text>
  <text x="30" y="183" fill="#8b949e" font-size="9">sed -i 's/old_host/new_host/g' /etc/nginx/nginx.conf</text>
  <text x="330" y="183" fill="#58a6ff" font-size="9">← in-place config update</text>

  <!-- sed/awk quick ref -->
  <rect x="524" y="132" width="256" height="62" fill="#161b22" rx="4" stroke="#30363d" stroke-width="1"/>
  <text x="534" y="147" fill="#d29922" font-size="9">sed 's/old/new/g' file     replace all</text>
  <text x="534" y="160" fill="#d29922" font-size="9">sed -i.bak 's/.../...' f   backup+edit</text>
  <text x="534" y="173" fill="#bc8cff" font-size="9">awk -F: '{print $1}' file  field split</text>
  <text x="534" y="186" fill="#bc8cff" font-size="9">awk '{sum+=$1}END{print}'  aggregate</text>

  <!-- Bottom bar -->
  <line x1="20" y1="204" x2="780" y2="204" stroke="#30363d" stroke-width="1"/>
  <text x="20" y="224" fill="#8b949e" font-size="10">$</text>
  <text x="32" y="224" fill="#3fb950" font-size="10">find / -size +1G</text>
  <text x="162" y="224" fill="#30363d" font-size="10">|</text>
  <text x="170" y="224" fill="#3fb950" font-size="10">grep -rn "pattern" ./src</text>
  <text x="330" y="224" fill="#30363d" font-size="10">|</text>
  <text x="338" y="224" fill="#3fb950" font-size="10">sed '/^#/d' config.conf</text>
  <text x="494" y="224" fill="#30363d" font-size="10">|</text>
  <text x="502" y="224" fill="#3fb950" font-size="10">awk '{print $7}' access.log | sort | uniq -c | sort -rn | head 10</text>
  <text x="20" y="248" fill="#8b949e" font-size="10">Tip: add --dry-run or use echo to preview destructive find -exec / sed -i before running for real</text>
</svg>
