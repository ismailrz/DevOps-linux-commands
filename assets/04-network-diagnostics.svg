<svg viewBox="0 0 800 260" xmlns="http://www.w3.org/2000/svg">
  <defs><style>text{font-family:'Courier New',Courier,monospace}</style></defs>
  <rect width="800" height="260" fill="#0d1117" rx="10"/>
  <rect width="800" height="40" fill="#161b22" rx="10"/>
  <rect y="20" width="800" height="20" fill="#161b22"/>
  <circle cx="24" cy="20" r="6" fill="#f85149"/>
  <circle cx="44" cy="20" r="6" fill="#d29922"/>
  <circle cx="64" cy="20" r="6" fill="#3fb950"/>
  <text x="400" y="25" text-anchor="middle" fill="#8b949e" font-size="12">Network Diagnostics — ip · ss · ping · curl · dig · tcpdump · iptables</text>

  <!-- Node: Local Machine -->
  <rect x="20" y="70" width="110" height="50" fill="#161b22" rx="6" stroke="#58a6ff" stroke-width="2"/>
  <text x="75" y="90" text-anchor="middle" fill="#58a6ff" font-size="11">💻</text>
  <text x="75" y="105" text-anchor="middle" fill="#58a6ff" font-size="10">Local</text>
  <text x="75" y="116" text-anchor="middle" fill="#8b949e" font-size="9">192.168.1.10</text>

  <!-- Arrow 1 -->
  <line x1="130" y1="95" x2="200" y2="95" stroke="#30363d" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Node: Router/Firewall -->
  <rect x="200" y="70" width="110" height="50" fill="#161b22" rx="6" stroke="#d29922" stroke-width="2"/>
  <text x="255" y="88" text-anchor="middle" fill="#d29922" font-size="10">🔥 Router</text>
  <text x="255" y="100" text-anchor="middle" fill="#d29922" font-size="9">iptables</text>
  <text x="255" y="112" text-anchor="middle" fill="#8b949e" font-size="9">192.168.1.1</text>

  <!-- Arrow 2 -->
  <line x1="310" y1="95" x2="380" y2="95" stroke="#30363d" stroke-width="2"/>

  <!-- Node: Internet Cloud -->
  <rect x="345" y="70" width="110" height="50" fill="#161b22" rx="6" stroke="#30363d" stroke-width="1"/>
  <text x="400" y="90" text-anchor="middle" fill="#8b949e" font-size="11">☁️</text>
  <text x="400" y="105" text-anchor="middle" fill="#8b949e" font-size="10">Internet</text>
  <text x="400" y="116" text-anchor="middle" fill="#30363d" font-size="9">BGP / DNS</text>

  <!-- Arrow 3 -->
  <line x1="455" y1="95" x2="525" y2="95" stroke="#30363d" stroke-width="2"/>

  <!-- Node: DNS Server -->
  <rect x="490" y="55" width="95" height="40" fill="#161b22" rx="6" stroke="#bc8cff" stroke-width="1"/>
  <text x="537" y="72" text-anchor="middle" fill="#bc8cff" font-size="10">DNS</text>
  <text x="537" y="83" text-anchor="middle" fill="#8b949e" font-size="9">8.8.8.8</text>
  <line x1="537" y1="95" x2="537" y2="95" stroke="#bc8cff" stroke-width="1" stroke-dasharray="4"/>

  <!-- Node: Server -->
  <rect x="535" y="70" width="110" height="50" fill="#161b22" rx="6" stroke="#3fb950" stroke-width="2"/>
  <text x="590" y="88" text-anchor="middle" fill="#3fb950" font-size="10">🖥 Server</text>
  <text x="590" y="100" text-anchor="middle" fill="#3fb950" font-size="9">nginx :80/:443</text>
  <text x="590" y="112" text-anchor="middle" fill="#8b949e" font-size="9">10.0.0.5</text>

  <!-- Tool labels -->
  <text x="145" y="143" text-anchor="middle" fill="#58a6ff" font-size="9">ip addr</text>
  <text x="145" y="154" text-anchor="middle" fill="#58a6ff" font-size="9">ss -tulnp</text>

  <text x="255" y="140" text-anchor="middle" fill="#d29922" font-size="9">ping / traceroute</text>
  <text x="255" y="151" text-anchor="middle" fill="#d29922" font-size="9">mtr / tcpdump</text>

  <text x="400" y="140" text-anchor="middle" fill="#8b949e" font-size="9">curl / wget</text>

  <text x="537" y="143" text-anchor="middle" fill="#bc8cff" font-size="9">dig / nslookup</text>

  <text x="590" y="140" text-anchor="middle" fill="#3fb950" font-size="9">ss -tulnp</text>
  <text x="590" y="151" text-anchor="middle" fill="#3fb950" font-size="9">lsof -i :80</text>

  <!-- Dashed vertical lines from tools to nodes -->
  <line x1="145" y1="120" x2="145" y2="135" stroke="#58a6ff" stroke-width="1" stroke-dasharray="3"/>
  <line x1="255" y1="120" x2="255" y2="132" stroke="#d29922" stroke-width="1" stroke-dasharray="3"/>
  <line x1="537" y1="95" x2="537" y2="115" stroke="#bc8cff" stroke-width="1" stroke-dasharray="3"/>
  <line x1="590" y1="120" x2="590" y2="132" stroke="#3fb950" stroke-width="1" stroke-dasharray="3"/>

  <!-- DNS dotted line -->
  <line x1="537" y1="95" x2="537" y2="75" stroke="#bc8cff" stroke-width="1" stroke-dasharray="3"/>

  <!-- Bottom bar -->
  <line x1="20" y1="170" x2="780" y2="170" stroke="#30363d" stroke-width="1"/>
  <text x="20" y="190" fill="#8b949e" font-size="10">$</text>
  <text x="32" y="190" fill="#3fb950" font-size="10">ip a</text>
  <text x="56" y="190" fill="#30363d" font-size="10">|</text>
  <text x="64" y="190" fill="#3fb950" font-size="10">ss -tulnp</text>
  <text x="148" y="190" fill="#30363d" font-size="10">|</text>
  <text x="156" y="190" fill="#3fb950" font-size="10">ping -c4 8.8.8.8</text>
  <text x="280" y="190" fill="#30363d" font-size="10">|</text>
  <text x="288" y="190" fill="#3fb950" font-size="10">mtr --report google.com</text>
  <text x="468" y="190" fill="#30363d" font-size="10">|</text>
  <text x="476" y="190" fill="#3fb950" font-size="10">dig +trace example.com</text>
  <text x="650" y="190" fill="#30363d" font-size="10">|</text>
  <text x="658" y="190" fill="#3fb950" font-size="10">curl -v URL</text>
  <text x="20" y="218" fill="#8b949e" font-size="10">$ tcpdump -i eth0 port 80</text>
  <text x="246" y="218" fill="#30363d" font-size="10">|</text>
  <text x="254" y="218" fill="#3fb950" font-size="10">iptables -L -n -v</text>
  <text x="410" y="218" fill="#30363d" font-size="10">|</text>
  <text x="418" y="218" fill="#3fb950" font-size="10">curl -o /dev/null -s -w "%{http_code}"</text>
  <text x="20" y="248" fill="#8b949e" font-size="10">Tip: 100% mtr loss at a middle hop that recovers downstream = ICMP filtering, not a real outage</text>
</svg>
