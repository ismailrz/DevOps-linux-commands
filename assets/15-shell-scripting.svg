<svg viewBox="0 0 800 260" xmlns="http://www.w3.org/2000/svg">
  <defs><style>text{font-family:'Courier New',Courier,monospace}</style></defs>
  <rect width="800" height="260" fill="#0d1117" rx="10"/>
  <rect width="800" height="40" fill="#161b22" rx="10"/>
  <rect y="20" width="800" height="20" fill="#161b22"/>
  <circle cx="24" cy="20" r="6" fill="#f85149"/>
  <circle cx="44" cy="20" r="6" fill="#d29922"/>
  <circle cx="64" cy="20" r="6" fill="#3fb950"/>
  <text x="400" y="25" text-anchor="middle" fill="#8b949e" font-size="12">Bash Shell Scripting for DevOps — safety flags · functions · loops · trap</text>

  <!-- Script anatomy label -->
  <text x="20" y="62" fill="#58a6ff" font-size="11" font-weight="bold">● PRODUCTION BASH SCRIPT ANATOMY</text>

  <!-- Script box -->
  <rect x="20" y="68" width="420" height="162" fill="#161b22" rx="6" stroke="#30363d" stroke-width="1"/>

  <!-- Line 1: shebang -->
  <rect x="20" y="68" width="420" height="18" fill="#21262d" rx="6"/>
  <rect x="20" y="78" width="420" height="8" fill="#21262d"/>
  <text x="32" y="80" fill="#bc8cff" font-size="10">#!/usr/bin/env bash</text>

  <!-- Line 2: set flags -->
  <text x="32" y="96" fill="#d29922" font-size="10">set -euo pipefail</text>
  <rect x="200" y="87" width="235" height="14" fill="#21262d" rx="2"/>
  <text x="206" y="97" fill="#8b949e" font-size="8">-e exit on error  -u unset=error  -o pipefail</text>

  <!-- Line 3: trap -->
  <text x="32" y="114" fill="#f85149" font-size="10">trap cleanup EXIT</text>
  <rect x="200" y="106" width="235" height="14" fill="#21262d" rx="2"/>
  <text x="206" y="116" fill="#8b949e" font-size="8">runs cleanup() on any exit (even errors)</text>

  <!-- Line 4: log functions -->
  <text x="32" y="132" fill="#3fb950" font-size="10">log_info()  { echo "[INFO]  $(date) $*"; }</text>
  <text x="32" y="148" fill="#f85149" font-size="10">log_error() { echo "[ERROR] $(date) $*" &gt;&amp;2; }</text>

  <!-- Line 5: retry function -->
  <text x="32" y="166" fill="#58a6ff" font-size="10">retry() { … }   </text>
  <rect x="130" y="158" width="305" height="14" fill="#21262d" rx="2"/>
  <text x="136" y="168" fill="#8b949e" font-size="8">retries + delay logic for flaky operations</text>

  <!-- Line 6: main logic -->
  <text x="32" y="184" fill="#e6edf3" font-size="10">retry 3 5 curl --fail https://api.example.com</text>
  <text x="32" y="198" fill="#e6edf3" font-size="10">systemctl restart myapp</text>
  <text x="32" y="212" fill="#e6edf3" font-size="10">log_info "Deploy complete"</text>

  <!-- Right side: exit flow -->
  <text x="460" y="62" fill="#d29922" font-size="11" font-weight="bold">● EXIT FLOW</text>

  <!-- Normal flow -->
  <rect x="460" y="70" width="110" height="24" fill="#0d3320" rx="4" stroke="#3fb950" stroke-width="1"/>
  <text x="515" y="86" text-anchor="middle" fill="#3fb950" font-size="9">Script starts</text>

  <line x1="515" y1="94" x2="515" y2="112" stroke="#3fb950" stroke-width="1.5"/>
  <polygon points="511,112 515,120 519,112" fill="#3fb950"/>

  <rect x="460" y="120" width="110" height="24" fill="#161b22" rx="4" stroke="#58a6ff" stroke-width="1"/>
  <text x="515" y="136" text-anchor="middle" fill="#58a6ff" font-size="9">Command fails</text>

  <!-- -e catches error -->
  <line x1="515" y1="144" x2="515" y2="162" stroke="#f85149" stroke-width="1.5"/>
  <polygon points="511,162 515,170 519,162" fill="#f85149"/>

  <rect x="460" y="170" width="110" height="24" fill="#2d1010" rx="4" stroke="#f85149" stroke-width="1"/>
  <text x="515" y="186" text-anchor="middle" fill="#f85149" font-size="9">set -e triggers</text>

  <!-- trap runs cleanup -->
  <line x1="515" y1="194" x2="515" y2="212" stroke="#d29922" stroke-width="1.5"/>
  <polygon points="511,212 515,220 519,212" fill="#d29922"/>

  <rect x="460" y="220" width="110" height="24" fill="#161b22" rx="4" stroke="#d29922" stroke-width="1"/>
  <text x="515" y="236" text-anchor="middle" fill="#d29922" font-size="9">trap cleanup EXIT</text>

  <!-- Notes column -->
  <rect x="590" y="68" width="190" height="180" fill="#161b22" rx="4" stroke="#30363d" stroke-width="1"/>
  <text x="600" y="83" fill="#8b949e" font-size="9">Key patterns:</text>
  <line x1="595" y1="87" x2="775" y2="87" stroke="#30363d" stroke-width="1"/>
  <text x="600" y="101" fill="#3fb950" font-size="8">for s in "${servers[@]}"; do</text>
  <text x="600" y="112" fill="#3fb950" font-size="8">  ssh $s "systemctl restart app"</text>
  <text x="600" y="123" fill="#3fb950" font-size="8">done</text>
  <line x1="595" y1="128" x2="775" y2="128" stroke="#30363d" stroke-width="1"/>
  <text x="600" y="142" fill="#d29922" font-size="8">while ! curl -sf $URL; do</text>
  <text x="600" y="153" fill="#d29922" font-size="8">  sleep 2</text>
  <text x="600" y="164" fill="#d29922" font-size="8">done  # wait for health</text>
  <line x1="595" y1="169" x2="775" y2="169" stroke="#30363d" stroke-width="1"/>
  <text x="600" y="183" fill="#58a6ff" font-size="8">PORT=${APP_PORT:-8080}</text>
  <text x="600" y="194" fill="#8b949e" font-size="8"># safe default value</text>
  <line x1="595" y1="199" x2="775" y2="199" stroke="#30363d" stroke-width="1"/>
  <text x="600" y="213" fill="#f85149" font-size="8">2&gt;&amp;1  redirect stderr→stdout</text>
  <text x="600" y="225" fill="#f85149" font-size="8">&gt;/dev/null  discard output</text>
  <text x="600" y="240" fill="#8b949e" font-size="8">$?  exit code of last command</text>

  <!-- Bottom bar -->
  <line x1="20" y1="242" x2="780" y2="242" stroke="#30363d" stroke-width="1"/>
</svg>
