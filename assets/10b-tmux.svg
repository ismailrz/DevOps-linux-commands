<svg viewBox="0 0 800 260" xmlns="http://www.w3.org/2000/svg">
  <defs><style>text{font-family:'Courier New',Courier,monospace}</style></defs>
  <rect width="800" height="260" fill="#0d1117" rx="10"/>
  <rect width="800" height="40" fill="#161b22" rx="10"/>
  <rect y="20" width="800" height="20" fill="#161b22"/>
  <circle cx="24" cy="20" r="6" fill="#f85149"/>
  <circle cx="44" cy="20" r="6" fill="#d29922"/>
  <circle cx="64" cy="20" r="6" fill="#3fb950"/>
  <text x="400" y="25" text-anchor="middle" fill="#8b949e" font-size="12">tmux — Terminal Multiplexer for Persistent Remote Sessions</text>

  <!-- Session persistence diagram -->
  <text x="20" y="62" fill="#58a6ff" font-size="11" font-weight="bold">● SESSION PERSISTENCE</text>

  <!-- Laptop -->
  <rect x="20" y="70" width="80" height="46" fill="#161b22" rx="5" stroke="#58a6ff" stroke-width="1"/>
  <text x="60" y="90" text-anchor="middle" fill="#58a6ff" font-size="9">💻 Local</text>
  <text x="60" y="103" text-anchor="middle" fill="#8b949e" font-size="8">SSH client</text>

  <!-- connected arrow -->
  <line x1="100" y1="93" x2="148" y2="93" stroke="#3fb950" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="124" y="88" text-anchor="middle" fill="#3fb950" font-size="8">SSH</text>

  <!-- Server with tmux session -->
  <rect x="148" y="58" width="160" height="70" fill="#161b22" rx="5" stroke="#d29922" stroke-width="2"/>
  <text x="228" y="74" text-anchor="middle" fill="#d29922" font-size="9">🖥 Server</text>
  <rect x="158" y="78" width="140" height="42" fill="#0d1117" rx="3" stroke="#30363d" stroke-width="1"/>
  <text x="228" y="92" text-anchor="middle" fill="#3fb950" font-size="8">tmux session: deploy</text>
  <text x="228" y="105" text-anchor="middle" fill="#8b949e" font-size="7">./migrate.sh  [running...]</text>

  <!-- disconnect lightning -->
  <line x1="100" y1="115" x2="148" y2="115" stroke="#f85149" stroke-width="2" stroke-dasharray="2,2"/>
  <text x="124" y="130" text-anchor="middle" fill="#f85149" font-size="8">disconnect!</text>

  <!-- Server still running -->
  <rect x="330" y="58" width="130" height="70" fill="#161b22" rx="5" stroke="#3fb950" stroke-width="2"/>
  <text x="395" y="74" text-anchor="middle" fill="#3fb950" font-size="9">Session lives on</text>
  <rect x="338" y="78" width="114" height="42" fill="#0d1117" rx="3" stroke="#30363d" stroke-width="1"/>
  <text x="395" y="93" text-anchor="middle" fill="#3fb950" font-size="8">tmux: deploy ●</text>
  <text x="395" y="105" text-anchor="middle" fill="#8b949e" font-size="7">migrate.sh still running</text>

  <!-- re-attach arrow -->
  <line x1="476" y1="93" x2="524" y2="93" stroke="#58a6ff" stroke-width="2"/>
  <polygon points="524,89 532,93 524,97" fill="#58a6ff"/>
  <text x="500" y="87" text-anchor="middle" fill="#58a6ff" font-size="8">tmux attach</text>

  <!-- Re-connected laptop -->
  <rect x="532" y="70" width="80" height="46" fill="#0d3320" rx="5" stroke="#3fb950" stroke-width="1"/>
  <text x="572" y="90" text-anchor="middle" fill="#3fb950" font-size="9">💻 Rejoin</text>
  <text x="572" y="103" text-anchor="middle" fill="#8b949e" font-size="8">session resumed</text>

  <!-- Layout reference -->
  <text x="20" y="148" fill="#d29922" font-size="11" font-weight="bold">● KEY BINDINGS  (prefix = Ctrl+b)</text>
  <rect x="20" y="154" width="365" height="72" fill="#161b22" rx="4" stroke="#30363d" stroke-width="1"/>
  <text x="30" y="169" fill="#d29922" font-size="9">Sessions</text>
  <text x="105" y="169" fill="#3fb950" font-size="9">new -s name</text>
  <text x="210" y="169" fill="#8b949e" font-size="8">new session</text>
  <text x="105" y="182" fill="#3fb950" font-size="9">attach -t name</text>
  <text x="210" y="182" fill="#8b949e" font-size="8">attach to session</text>
  <text x="105" y="195" fill="#3fb950" font-size="9">Ctrl+b  d</text>
  <text x="210" y="195" fill="#8b949e" font-size="8">detach (keep running)</text>
  <text x="30" y="208" fill="#d29922" font-size="9">Windows</text>
  <text x="105" y="208" fill="#3fb950" font-size="9">Ctrl+b  c  n  p  0-9</text>
  <text x="280" y="208" fill="#8b949e" font-size="8">new/next/prev/jump</text>
  <text x="30" y="221" fill="#d29922" font-size="9">Panes</text>
  <text x="105" y="221" fill="#3fb950" font-size="9">Ctrl+b  "  %  arrows</text>
  <text x="280" y="221" fill="#8b949e" font-size="8">split horiz/vert/navigate</text>

  <!-- tmux layout visual -->
  <rect x="400" y="148" width="380" height="80" fill="#0d1117" rx="4" stroke="#d29922" stroke-width="1"/>
  <text x="412" y="162" fill="#d29922" font-size="8">tmux layout: 1 session → 2 windows → split panes</text>
  <line x1="400" y1="165" x2="780" y2="165" stroke="#30363d" stroke-width="1"/>
  <!-- window tabs -->
  <rect x="404" y="168" width="60" height="12" fill="#d29922" rx="2"/>
  <text x="434" y="177" text-anchor="middle" fill="#0d1117" font-size="7">1:deploy</text>
  <rect x="468" y="168" width="60" height="12" fill="#30363d" rx="2"/>
  <text x="498" y="177" text-anchor="middle" fill="#8b949e" font-size="7">2:logs</text>
  <!-- pane split -->
  <rect x="404" y="182" width="183" height="40" fill="#161b22" rx="2" stroke="#30363d" stroke-width="1"/>
  <text x="495" y="198" text-anchor="middle" fill="#8b949e" font-size="8">pane 1</text>
  <text x="495" y="211" text-anchor="middle" fill="#3fb950" font-size="7">./deploy.sh</text>
  <rect x="590" y="182" width="185" height="40" fill="#161b22" rx="2" stroke="#30363d" stroke-width="1"/>
  <text x="682" y="198" text-anchor="middle" fill="#8b949e" font-size="8">pane 2</text>
  <text x="682" y="211" text-anchor="middle" fill="#3fb950" font-size="7">tail -f app.log</text>

  <!-- Bottom bar -->
  <line x1="20" y1="238" x2="780" y2="238" stroke="#30363d" stroke-width="1"/>
  <text x="20" y="254" fill="#8b949e" font-size="10">$ tmux new -s deploy  |  tmux ls  |  tmux attach -t deploy  |  Ctrl+b d  detach  |  tmux kill-session -t name</text>
</svg>
