<svg viewBox="0 0 800 260" xmlns="http://www.w3.org/2000/svg">
  <defs><style>text{font-family:'Courier New',Courier,monospace}</style></defs>
  <rect width="800" height="260" fill="#0d1117" rx="10"/>
  <rect width="800" height="40" fill="#161b22" rx="10"/>
  <rect y="20" width="800" height="20" fill="#161b22"/>
  <circle cx="24" cy="20" r="6" fill="#f85149"/>
  <circle cx="44" cy="20" r="6" fill="#d29922"/>
  <circle cx="64" cy="20" r="6" fill="#3fb950"/>
  <text x="400" y="25" text-anchor="middle" fill="#8b949e" font-size="12">tee — Write to stdout and a File Simultaneously</text>

  <!-- tee fork diagram title -->
  <text x="20" y="62" fill="#58a6ff" font-size="11" font-weight="bold">● TEE FORK DIAGRAM</text>

  <!-- stdin source -->
  <rect x="20" y="72" width="110" height="36" fill="#161b22" rx="5" stroke="#30363d" stroke-width="1"/>
  <text x="75" y="86" text-anchor="middle" fill="#8b949e" font-size="10">./deploy.sh</text>
  <text x="75" y="99" text-anchor="middle" fill="#8b949e" font-size="8">stdout output</text>

  <!-- pipe arrow -->
  <line x1="130" y1="90" x2="168" y2="90" stroke="#58a6ff" stroke-width="2"/>
  <polygon points="168,86 176,90 168,94" fill="#58a6ff"/>
  <rect x="138" y="82" width="20" height="16" fill="#30363d" rx="2"/>
  <text x="148" y="93" text-anchor="middle" fill="#e6edf3" font-size="9">|</text>

  <!-- tee box -->
  <rect x="176" y="68" width="80" height="44" fill="#161b22" rx="5" stroke="#d29922" stroke-width="2"/>
  <text x="216" y="88" text-anchor="middle" fill="#d29922" font-size="14">tee</text>
  <text x="216" y="103" text-anchor="middle" fill="#8b949e" font-size="8">splits stream</text>

  <!-- Arrow up to stdout -->
  <line x1="256" y1="80" x2="320" y2="65" stroke="#3fb950" stroke-width="2"/>
  <polygon points="315,61 322,63 318,70" fill="#3fb950"/>

  <!-- stdout terminal box -->
  <rect x="322" y="50" width="130" height="38" fill="#0d3320" rx="5" stroke="#3fb950" stroke-width="1"/>
  <text x="387" y="66" text-anchor="middle" fill="#3fb950" font-size="9">Terminal (stdout)</text>
  <text x="387" y="79" text-anchor="middle" fill="#8b949e" font-size="8">you still see the output</text>

  <!-- Arrow down to file -->
  <line x1="256" y1="100" x2="320" y2="115" stroke="#58a6ff" stroke-width="2"/>
  <polygon points="315,118 322,111 318,120" fill="#58a6ff"/>

  <!-- file box -->
  <rect x="322" y="100" width="130" height="38" fill="#161b22" rx="5" stroke="#58a6ff" stroke-width="1"/>
  <text x="387" y="116" text-anchor="middle" fill="#58a6ff" font-size="9">deploy.log</text>
  <text x="387" y="129" text-anchor="middle" fill="#8b949e" font-size="8">written to disk simultaneously</text>

  <!-- Use cases box -->
  <rect x="480" y="50" width="300" height="100" fill="#161b22" rx="5" stroke="#30363d" stroke-width="1"/>
  <text x="630" y="66" text-anchor="middle" fill="#d29922" font-size="9">Common Use Cases</text>
  <line x1="485" y1="70" x2="775" y2="70" stroke="#30363d" stroke-width="1"/>
  <text x="490" y="84"  fill="#3fb950" font-size="9">./deploy.sh | tee deploy.log</text>
  <text x="490" y="97"  fill="#3fb950" font-size="9">./deploy.sh | tee -a deploy.log</text>
  <text x="490" y="110" fill="#8b949e" font-size="8">-a  append (don't overwrite)</text>
  <text x="490" y="123" fill="#3fb950" font-size="9">./build.sh 2&gt;&amp;1 | tee build.log</text>
  <text x="490" y="136" fill="#8b949e" font-size="8">capture stderr too</text>

  <!-- sudo tee pattern -->
  <text x="20" y="168" fill="#f85149" font-size="11" font-weight="bold">● SUDO TEE PATTERN — write to privileged files</text>
  <rect x="20" y="174" width="760" height="44" fill="#161b22" rx="4" stroke="#f85149" stroke-width="1"/>
  <text x="30" y="190" fill="#e6edf3" font-size="10">echo "vm.swappiness=10" | sudo tee -a /etc/sysctl.d/99-tuning.conf</text>
  <text x="30" y="206" fill="#8b949e" font-size="9">→ you cannot use  sudo echo "..." &gt; /etc/...  (redirect happens as your user, not root)</text>
  <text x="30" y="217" fill="#8b949e" font-size="9">→ piping to  sudo tee  works because tee runs as root and does the write</text>

  <!-- Bottom bar -->
  <line x1="20" y1="228" x2="780" y2="228" stroke="#30363d" stroke-width="1"/>
  <text x="20" y="248" fill="#8b949e" font-size="10">$ ./script.sh | tee out.log  |  cmd | tee -a log  |  cmd 2&gt;&amp;1 | tee log  |  echo "cfg" | sudo tee /etc/file</text>
</svg>
