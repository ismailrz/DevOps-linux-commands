<svg viewBox="0 0 800 260" xmlns="http://www.w3.org/2000/svg">
  <defs><style>text{font-family:'Courier New',Courier,monospace}</style></defs>
  <rect width="800" height="260" fill="#0d1117" rx="10"/>
  <rect width="800" height="40" fill="#161b22" rx="10"/>
  <rect y="20" width="800" height="20" fill="#161b22"/>
  <circle cx="24" cy="20" r="6" fill="#f85149"/>
  <circle cx="44" cy="20" r="6" fill="#d29922"/>
  <circle cx="64" cy="20" r="6" fill="#3fb950"/>
  <text x="400" y="25" text-anchor="middle" fill="#8b949e" font-size="12">System Monitoring — top · htop · vmstat · iostat · free · sar</text>

  <!-- CPU Section -->
  <text x="20" y="62" fill="#58a6ff" font-size="11" font-weight="bold">● CPU CORES</text>
  <text x="20" y="84" fill="#8b949e" font-size="10">cpu0</text>
  <rect x="60" y="73" width="240" height="13" fill="#21262d" rx="2"/>
  <rect x="60" y="73" width="168" height="13" fill="#3fb950" rx="2"/>
  <text x="307" y="83" fill="#e6edf3" font-size="10">70%</text>

  <text x="20" y="105" fill="#8b949e" font-size="10">cpu1</text>
  <rect x="60" y="94" width="240" height="13" fill="#21262d" rx="2"/>
  <rect x="60" y="94" width="96" height="13" fill="#3fb950" rx="2"/>
  <text x="307" y="104" fill="#e6edf3" font-size="10">40%</text>

  <text x="20" y="126" fill="#8b949e" font-size="10">cpu2</text>
  <rect x="60" y="115" width="240" height="13" fill="#21262d" rx="2"/>
  <rect x="60" y="115" width="216" height="13" fill="#d29922" rx="2"/>
  <text x="307" y="125" fill="#e6edf3" font-size="10">90%</text>

  <text x="20" y="147" fill="#8b949e" font-size="10">cpu3</text>
  <rect x="60" y="136" width="240" height="13" fill="#21262d" rx="2"/>
  <rect x="60" y="136" width="48" height="13" fill="#3fb950" rx="2"/>
  <text x="307" y="146" fill="#e6edf3" font-size="10">20%</text>

  <!-- Divider -->
  <line x1="345" y1="50" x2="345" y2="178" stroke="#30363d" stroke-width="1"/>

  <!-- Memory Section -->
  <text x="362" y="62" fill="#bc8cff" font-size="11" font-weight="bold">● MEMORY</text>
  <text x="362" y="84" fill="#8b949e" font-size="10">RAM</text>
  <rect x="398" y="73" width="210" height="13" fill="#21262d" rx="2"/>
  <rect x="398" y="73" width="100" height="13" fill="#58a6ff" rx="2"/>
  <rect x="498" y="73" width="63" height="13" fill="#1c3a5e" rx="2"/>
  <text x="616" y="83" fill="#e6edf3" font-size="10">10.5 / 16 GB</text>
  <text x="398" y="97" fill="#58a6ff" font-size="9">■ used</text>
  <text x="445" y="97" fill="#1c3a5e" font-size="9">■ cache</text>
  <text x="498" y="97" fill="#8b949e" font-size="9">■ free</text>

  <text x="362" y="117" fill="#8b949e" font-size="10">Swap</text>
  <rect x="398" y="106" width="210" height="13" fill="#21262d" rx="2"/>
  <rect x="398" y="106" width="11" height="13" fill="#f85149" rx="2"/>
  <text x="616" y="116" fill="#e6edf3" font-size="10">0.2 / 4 GB</text>

  <!-- Load Average -->
  <text x="362" y="143" fill="#d29922" font-size="11" font-weight="bold">● LOAD AVERAGE</text>
  <rect x="362" y="150" width="66" height="32" fill="#161b22" rx="4" stroke="#30363d" stroke-width="1"/>
  <text x="395" y="163" text-anchor="middle" fill="#3fb950" font-size="14" font-weight="bold">1.23</text>
  <text x="395" y="177" text-anchor="middle" fill="#8b949e" font-size="9">1 min</text>
  <rect x="438" y="150" width="66" height="32" fill="#161b22" rx="4" stroke="#30363d" stroke-width="1"/>
  <text x="471" y="163" text-anchor="middle" fill="#d29922" font-size="14" font-weight="bold">2.45</text>
  <text x="471" y="177" text-anchor="middle" fill="#8b949e" font-size="9">5 min</text>
  <rect x="514" y="150" width="66" height="32" fill="#161b22" rx="4" stroke="#30363d" stroke-width="1"/>
  <text x="547" y="163" text-anchor="middle" fill="#f85149" font-size="14" font-weight="bold">3.10</text>
  <text x="547" y="177" text-anchor="middle" fill="#8b949e" font-size="9">15 min</text>
  <text x="594" y="162" fill="#8b949e" font-size="10">4-core:</text>
  <text x="594" y="176" fill="#3fb950" font-size="10">4.0 = 100%</text>

  <!-- Bottom bar -->
  <line x1="20" y1="188" x2="780" y2="188" stroke="#30363d" stroke-width="1"/>
  <text x="20" y="208" fill="#8b949e" font-size="10">$</text>
  <text x="32" y="208" fill="#3fb950" font-size="10">top</text>
  <text x="54" y="208" fill="#30363d" font-size="10">|</text>
  <text x="62" y="208" fill="#3fb950" font-size="10">htop</text>
  <text x="96" y="208" fill="#30363d" font-size="10">|</text>
  <text x="104" y="208" fill="#3fb950" font-size="10">vmstat 2 5</text>
  <text x="188" y="208" fill="#30363d" font-size="10">|</text>
  <text x="196" y="208" fill="#3fb950" font-size="10">iostat -xz 2</text>
  <text x="290" y="208" fill="#30363d" font-size="10">|</text>
  <text x="298" y="208" fill="#3fb950" font-size="10">free -h</text>
  <text x="346" y="208" fill="#30363d" font-size="10">|</text>
  <text x="354" y="208" fill="#3fb950" font-size="10">sar -u 2 10</text>
  <text x="20" y="240" fill="#8b949e" font-size="10">Tip: load &gt; num_cores = CPU bottleneck  ·  wa% &gt; 20% = disk bottleneck  ·  si/so &gt; 0 = memory pressure</text>
</svg>
