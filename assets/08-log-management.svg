<svg viewBox="0 0 800 260" xmlns="http://www.w3.org/2000/svg">
  <defs><style>text{font-family:'Courier New',Courier,monospace}</style></defs>
  <rect width="800" height="260" fill="#0d1117" rx="10"/>
  <rect width="800" height="40" fill="#161b22" rx="10"/>
  <rect y="20" width="800" height="20" fill="#161b22"/>
  <circle cx="24" cy="20" r="6" fill="#f85149"/>
  <circle cx="44" cy="20" r="6" fill="#d29922"/>
  <circle cx="64" cy="20" r="6" fill="#3fb950"/>
  <text x="400" y="25" text-anchor="middle" fill="#8b949e" font-size="12">Log Management — journalctl · tail · grep · awk · logrotate</text>

  <!-- Pipeline title -->
  <text x="20" y="62" fill="#58a6ff" font-size="11" font-weight="bold">● LOG PIPELINE</text>

  <!-- App box -->
  <rect x="20" y="70" width="80" height="40" fill="#161b22" rx="5" stroke="#58a6ff" stroke-width="1"/>
  <text x="60" y="87" text-anchor="middle" fill="#58a6ff" font-size="10">App</text>
  <text x="60" y="100" text-anchor="middle" fill="#8b949e" font-size="8">stdout/stderr</text>

  <!-- Arrow -->
  <line x1="100" y1="90" x2="128" y2="90" stroke="#30363d" stroke-width="1.5"/>
  <polygon points="128,86 136,90 128,94" fill="#30363d"/>

  <!-- journald -->
  <rect x="136" y="70" width="90" height="40" fill="#161b22" rx="5" stroke="#d29922" stroke-width="1"/>
  <text x="181" y="87" text-anchor="middle" fill="#d29922" font-size="10">journald</text>
  <text x="181" y="100" text-anchor="middle" fill="#8b949e" font-size="8">binary journal</text>

  <!-- Arrow -->
  <line x1="226" y1="90" x2="254" y2="90" stroke="#30363d" stroke-width="1.5"/>
  <polygon points="254,86 262,90 254,94" fill="#30363d"/>

  <!-- journalctl -->
  <rect x="262" y="70" width="100" height="40" fill="#161b22" rx="5" stroke="#3fb950" stroke-width="1"/>
  <text x="312" y="87" text-anchor="middle" fill="#3fb950" font-size="10">journalctl</text>
  <text x="312" y="100" text-anchor="middle" fill="#8b949e" font-size="8">-u -f -p -b</text>

  <!-- Arrow -->
  <line x1="362" y1="90" x2="390" y2="90" stroke="#30363d" stroke-width="1.5"/>
  <polygon points="390,86 398,90 390,94" fill="#30363d"/>

  <!-- grep/awk -->
  <rect x="398" y="70" width="90" height="40" fill="#161b22" rx="5" stroke="#bc8cff" stroke-width="1"/>
  <text x="443" y="87" text-anchor="middle" fill="#bc8cff" font-size="10">grep/awk</text>
  <text x="443" y="100" text-anchor="middle" fill="#8b949e" font-size="8">filter &amp; extract</text>

  <!-- Arrow -->
  <line x1="488" y1="90" x2="516" y2="90" stroke="#30363d" stroke-width="1.5"/>
  <polygon points="516,86 524,90 516,94" fill="#30363d"/>

  <!-- Log file -->
  <rect x="524" y="70" width="90" height="40" fill="#161b22" rx="5" stroke="#d29922" stroke-width="1"/>
  <text x="569" y="87" text-anchor="middle" fill="#d29922" font-size="10">Log File</text>
  <text x="569" y="100" text-anchor="middle" fill="#8b949e" font-size="8">/var/log/*.log</text>

  <!-- Arrow -->
  <line x1="614" y1="90" x2="642" y2="90" stroke="#30363d" stroke-width="1.5"/>
  <polygon points="642,86 650,90 642,94" fill="#30363d"/>

  <!-- logrotate -->
  <rect x="650" y="70" width="100" height="40" fill="#161b22" rx="5" stroke="#8b949e" stroke-width="1"/>
  <text x="700" y="87" text-anchor="middle" fill="#8b949e" font-size="10">logrotate</text>
  <text x="700" y="100" text-anchor="middle" fill="#8b949e" font-size="8">compress+archive</text>

  <!-- Useful journalctl patterns -->
  <text x="20" y="130" fill="#3fb950" font-size="11" font-weight="bold">● MOST USEFUL journalctl PATTERNS</text>
  <rect x="20" y="136" width="370" height="52" fill="#161b22" rx="4" stroke="#30363d" stroke-width="1"/>
  <text x="30" y="151" fill="#e6edf3" font-size="10">journalctl -u nginx -f</text>
  <text x="200" y="151" fill="#8b949e" font-size="9">follow service logs live</text>
  <text x="30" y="165" fill="#e6edf3" font-size="10">journalctl -p err -b</text>
  <text x="200" y="165" fill="#8b949e" font-size="9">errors since last boot</text>
  <text x="30" y="179" fill="#e6edf3" font-size="10">journalctl --since "1 hour ago"</text>
  <text x="200" y="179" fill="#8b949e" font-size="9">filter by time</text>

  <!-- Log analysis patterns -->
  <text x="410" y="130" fill="#bc8cff" font-size="11" font-weight="bold">● LOG ANALYSIS PATTERNS</text>
  <rect x="410" y="136" width="365" height="52" fill="#161b22" rx="4" stroke="#30363d" stroke-width="1"/>
  <text x="420" y="151" fill="#e6edf3" font-size="10">tail -f /var/log/nginx/error.log</text>
  <text x="420" y="165" fill="#e6edf3" font-size="10">grep -C 3 "ERROR" app.log</text>
  <text x="420" y="179" fill="#e6edf3" font-size="10">awk '{print $1}' access.log | sort | uniq -c</text>

  <!-- Bottom bar -->
  <line x1="20" y1="200" x2="780" y2="200" stroke="#30363d" stroke-width="1"/>
  <text x="20" y="220" fill="#8b949e" font-size="10">$</text>
  <text x="32" y="220" fill="#3fb950" font-size="10">journalctl -u nginx -f</text>
  <text x="202" y="220" fill="#30363d" font-size="10">|</text>
  <text x="210" y="220" fill="#3fb950" font-size="10">journalctl --disk-usage</text>
  <text x="386" y="220" fill="#30363d" font-size="10">|</text>
  <text x="394" y="220" fill="#3fb950" font-size="10">journalctl --vacuum-size=1G</text>
  <text x="590" y="220" fill="#30363d" font-size="10">|</text>
  <text x="598" y="220" fill="#3fb950" font-size="10">logrotate --force</text>
  <text x="20" y="248" fill="#8b949e" font-size="10">Tip: journalctl -o json pipes to log shippers · grep -C 5 "FATAL" shows 5 lines of context</text>
</svg>
