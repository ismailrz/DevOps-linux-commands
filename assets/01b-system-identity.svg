<svg viewBox="0 0 800 260" xmlns="http://www.w3.org/2000/svg">
  <defs><style>text{font-family:'Courier New',Courier,monospace}</style></defs>
  <rect width="800" height="260" fill="#0d1117" rx="10"/>
  <rect width="800" height="40" fill="#161b22" rx="10"/>
  <rect y="20" width="800" height="20" fill="#161b22"/>
  <circle cx="24" cy="20" r="6" fill="#f85149"/>
  <circle cx="44" cy="20" r="6" fill="#d29922"/>
  <circle cx="64" cy="20" r="6" fill="#3fb950"/>
  <text x="400" y="25" text-anchor="middle" fill="#8b949e" font-size="12">System Identity — uname · uptime · hostname · /etc/os-release</text>

  <!-- uname -a output -->
  <text x="20" y="62" fill="#58a6ff" font-size="11" font-weight="bold">● uname -a</text>
  <rect x="20" y="68" width="760" height="22" fill="#161b22" rx="4" stroke="#30363d" stroke-width="1"/>
  <text x="30" y="82" fill="#8b949e" font-size="9">$</text>
  <text x="42" y="82" fill="#3fb950" font-size="9">uname -a</text>
  <text x="110" y="82" fill="#e6edf3" font-size="9">Linux web-01  5.15.0-76-generic #83-Ubuntu SMP  x86_64  GNU/Linux</text>
  <!-- annotate fields -->
  <text x="110" y="100" fill="#58a6ff" font-size="8">│</text>
  <text x="165" y="100" fill="#3fb950" font-size="8">│</text>
  <text x="358" y="100" fill="#d29922" font-size="8">│</text>
  <text x="530" y="100" fill="#bc8cff" font-size="8">│</text>
  <text x="100" y="110" fill="#58a6ff" font-size="8">hostname</text>
  <text x="155" y="110" fill="#3fb950" font-size="8">kernel version</text>
  <text x="345" y="110" fill="#d29922" font-size="8">build info</text>
  <text x="518" y="110" fill="#bc8cff" font-size="8">arch</text>

  <!-- uptime output -->
  <text x="20" y="128" fill="#d29922" font-size="11" font-weight="bold">● uptime</text>
  <rect x="20" y="134" width="760" height="22" fill="#161b22" rx="4" stroke="#30363d" stroke-width="1"/>
  <text x="30" y="148" fill="#8b949e" font-size="9">$</text>
  <text x="42" y="148" fill="#3fb950" font-size="9">uptime</text>
  <text x="100" y="148" fill="#e6edf3" font-size="9"> 14:32:18  up 42 days, 3:21,  2 users,  load average: 0.85, 0.92, 0.88</text>
  <!-- annotate uptime fields -->
  <text x="100" y="168" fill="#8b949e" font-size="8">time now</text>
  <text x="188" y="168" fill="#3fb950" font-size="8">uptime</text>
  <text x="310" y="168" fill="#d29922" font-size="8">logged in</text>
  <text x="430" y="168" fill="#58a6ff" font-size="8">load avg: 1min  5min  15min</text>

  <!-- hostname + os-release -->
  <rect x="20" y="178" width="375" height="42" fill="#161b22" rx="4" stroke="#30363d" stroke-width="1"/>
  <text x="30" y="193" fill="#8b949e" font-size="9">$</text>
  <text x="42" y="193" fill="#3fb950" font-size="9">hostname</text>
  <text x="130" y="193" fill="#e6edf3" font-size="9">web-01.prod.internal</text>
  <text x="30" y="212" fill="#8b949e" font-size="9">$</text>
  <text x="42" y="212" fill="#3fb950" font-size="9">hostname -I</text>
  <text x="140" y="212" fill="#e6edf3" font-size="9">10.0.1.15  172.17.0.1</text>

  <rect x="405" y="178" width="375" height="42" fill="#161b22" rx="4" stroke="#30363d" stroke-width="1"/>
  <text x="415" y="193" fill="#8b949e" font-size="9">$</text>
  <text x="427" y="193" fill="#3fb950" font-size="9">cat /etc/os-release | grep PRETTY</text>
  <text x="415" y="212" fill="#e6edf3" font-size="9">PRETTY_NAME="Ubuntu 22.04.3 LTS"</text>

  <!-- Bottom bar -->
  <line x1="20" y1="230" x2="780" y2="230" stroke="#30363d" stroke-width="1"/>
  <text x="20" y="248" fill="#8b949e" font-size="10">$ uname -r  |  uname -m  |  uptime  |  hostname -f  |  hostname -I  |  cat /etc/os-release</text>
</svg>
