<svg viewBox="0 0 800 260" xmlns="http://www.w3.org/2000/svg">
  <defs><style>text{font-family:'Courier New',Courier,monospace}</style></defs>
  <rect width="800" height="260" fill="#0d1117" rx="10"/>
  <rect width="800" height="40" fill="#161b22" rx="10"/>
  <rect y="20" width="800" height="20" fill="#161b22"/>
  <circle cx="24" cy="20" r="6" fill="#f85149"/>
  <circle cx="44" cy="20" r="6" fill="#d29922"/>
  <circle cx="64" cy="20" r="6" fill="#3fb950"/>
  <text x="400" y="25" text-anchor="middle" fill="#8b949e" font-size="12">Process Management — ps · kill · nice · strace · lsof</text>

  <!-- Process Tree -->
  <text x="20" y="62" fill="#58a6ff" font-size="11" font-weight="bold">● PROCESS TREE</text>

  <!-- systemd root -->
  <rect x="20" y="70" width="130" height="28" fill="#161b22" rx="4" stroke="#58a6ff" stroke-width="1"/>
  <text x="32" y="82" fill="#58a6ff" font-size="10">systemd</text>
  <text x="32" y="93" fill="#8b949e" font-size="9">PID 1  S  root</text>

  <!-- L1 branches -->
  <line x1="85" y1="98" x2="85" y2="118" stroke="#30363d" stroke-width="1"/>
  <line x1="85" y1="108" x2="180" y2="108" stroke="#30363d" stroke-width="1"/>
  <line x1="85" y1="108" x2="310" y2="108" stroke="#30363d" stroke-width="1"/>

  <!-- nginx master -->
  <rect x="155" y="98" width="130" height="28" fill="#161b22" rx="4" stroke="#3fb950" stroke-width="1"/>
  <text x="167" y="110" fill="#3fb950" font-size="10">nginx</text>
  <text x="167" y="121" fill="#8b949e" font-size="9">PID 234  S  www-data</text>

  <!-- sshd -->
  <rect x="285" y="98" width="130" height="28" fill="#161b22" rx="4" stroke="#d29922" stroke-width="1"/>
  <text x="297" y="110" fill="#d29922" font-size="10">sshd</text>
  <text x="297" y="121" fill="#8b949e" font-size="9">PID 312  S  root</text>

  <!-- nginx workers -->
  <line x1="220" y1="126" x2="220" y2="146" stroke="#30363d" stroke-width="1"/>
  <line x1="220" y1="136" x2="165" y2="136" stroke="#30363d" stroke-width="1"/>
  <line x1="220" y1="136" x2="275" y2="136" stroke="#30363d" stroke-width="1"/>

  <rect x="138" y="146" width="110" height="22" fill="#161b22" rx="4" stroke="#30363d" stroke-width="1"/>
  <text x="152" y="157" fill="#8b949e" font-size="9">worker PID 235  S</text>
  <text x="152" y="167" fill="#30363d" font-size="8">[nginx: worker]</text>

  <rect x="252" y="146" width="110" height="22" fill="#161b22" rx="4" stroke="#30363d" stroke-width="1"/>
  <text x="266" y="157" fill="#8b949e" font-size="9">worker PID 236  S</text>
  <text x="266" y="167" fill="#30363d" font-size="8">[nginx: worker]</text>

  <!-- Divider -->
  <line x1="420" y1="50" x2="420" y2="178" stroke="#30363d" stroke-width="1"/>

  <!-- Signals Table -->
  <text x="435" y="62" fill="#f85149" font-size="11" font-weight="bold">● SIGNALS</text>
  <rect x="435" y="68" width="340" height="20" fill="#161b22" rx="3"/>
  <text x="445" y="81" fill="#8b949e" font-size="10">SIG      NUM   BEHAVIOR</text>

  <text x="445" y="101" fill="#3fb950" font-size="10">SIGTERM</text>
  <text x="517" y="101" fill="#e6edf3" font-size="10">15</text>
  <text x="545" y="101" fill="#8b949e" font-size="10">Graceful shutdown — allows cleanup</text>

  <text x="445" y="118" fill="#f85149" font-size="10">SIGKILL</text>
  <text x="517" y="118" fill="#e6edf3" font-size="10"> 9</text>
  <text x="545" y="118" fill="#8b949e" font-size="10">Force kill — cannot be caught</text>

  <text x="445" y="135" fill="#d29922" font-size="10">SIGHUP </text>
  <text x="517" y="135" fill="#e6edf3" font-size="10"> 1</text>
  <text x="545" y="135" fill="#8b949e" font-size="10">Reload config (nginx, apache…)</text>

  <text x="445" y="152" fill="#bc8cff" font-size="10">SIGINT </text>
  <text x="517" y="152" fill="#e6edf3" font-size="10"> 2</text>
  <text x="545" y="152" fill="#8b949e" font-size="10">Interrupt — same as Ctrl+C</text>

  <!-- States Legend -->
  <text x="435" y="172" fill="#8b949e" font-size="9">States: R=running  S=sleeping  D=disk-wait  Z=zombie  T=stopped</text>

  <!-- Bottom bar -->
  <line x1="20" y1="188" x2="780" y2="188" stroke="#30363d" stroke-width="1"/>
  <text x="20" y="208" fill="#8b949e" font-size="10">$</text>
  <text x="32" y="208" fill="#3fb950" font-size="10">ps aux</text>
  <text x="74" y="208" fill="#30363d" font-size="10">|</text>
  <text x="82" y="208" fill="#3fb950" font-size="10">ps auxf</text>
  <text x="130" y="208" fill="#30363d" font-size="10">|</text>
  <text x="138" y="208" fill="#3fb950" font-size="10">kill -15 PID</text>
  <text x="218" y="208" fill="#30363d" font-size="10">|</text>
  <text x="226" y="208" fill="#3fb950" font-size="10">pkill nginx</text>
  <text x="298" y="208" fill="#30363d" font-size="10">|</text>
  <text x="306" y="208" fill="#3fb950" font-size="10">nice -n 10 CMD</text>
  <text x="414" y="208" fill="#30363d" font-size="10">|</text>
  <text x="422" y="208" fill="#3fb950" font-size="10">strace -p PID</text>
  <text x="500" y="208" fill="#30363d" font-size="10">|</text>
  <text x="508" y="208" fill="#3fb950" font-size="10">lsof -i :80</text>
  <text x="20" y="240" fill="#8b949e" font-size="10">Tip: always try SIGTERM first · only use SIGKILL (-9) if process doesn't respond after a few seconds</text>
</svg>
